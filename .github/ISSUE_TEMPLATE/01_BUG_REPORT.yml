name: "⚠️ Einen Fehlerbericht erstellen"
description: "Melden Sie merkwürdiges, störendes oder unerwartetes Verhalten."
title: "[FEHLER]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "# Fehlerbericht"
  - type: markdown
    attributes:
      value: |
        Ein Fehler (oft Bug genannt) ist eine Abweichung vom gewünschten Normalzustand.

        Er entsteht, wenn der Quellcode falsch geschrieben ist, Anforderungen unklar waren oder Daten nicht richtig verarbeitet werden. Das führt dazu, dass eine Webseite oder Web-App nicht das tut, was sie soll.

        Stellen Sie sicher das Sie sich zuerst alle Informationen im [Diskussionsforum](/hug-baustoffe/homepage/discussions) einholen, bevor Sie mit dem ausfüllen des Formulars beginnen.

        Detailierte Fehlerberichte sind extrem hilfreich wir Danken Ihnen für Ihre Geduld beim ausfüllen!
  - type: markdown
    attributes:
      value: "## Informationen"
  - type: input
    id: discussions
    attributes:
      label: Diskussionen
      description: Tragen Sie die eindeutige Diskussionsnummer oder mehrere in das Feld ein. Trennen Sie mehrere Diskussionsnummern mit einem Komma.
      placeholder: "#7, #8"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Zusammenfassung"
      description: "Eine kurze aber präzise Beschreibung des Problems. Was ist passiert? Was wurde erwartet was passieren sollte?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Fehler Reproduzieren"
      description: "Wie können wir das Problem nachvollziehen? Welche Schritte waren notwendig um den Fehler zu provizieren? Welche Konfigurationen wurden verwendet?"
    validations:
      required: true
  - type: textarea
    id: possible-solution
    attributes:
      label: "Mögliche Lösung"
      description: "Falls Sie konkrete Vorschläge haben die beim beheben des Fehlers helfen könnten, dann zögern Sie nicht dies uns mitzuteilen."
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: "Weitere Informationen"
      description: "Irgendwelche zusätzliche Informationen die Sie teilen möchten? Screenshots oder ähnliches?"
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Versionen"
  - type: input
    id: v-repository
    attributes:
      label: Repository
      description: Die Versionsnummer des Repositories.
      placeholder: main
    validations:
      required: true
  - type: input
    id: v-craft-cms
    attributes:
      label: Craft CMS
      description: Die Versionsnummer der Craft CMS Webanwendung.
      placeholder: 5.x
    validations:
      required: true
  - type: input
    id: v-php
    attributes:
      label: PHP
      description: Die Versionsnummer von PHP.
      placeholder: 8.2.0
    validations:
      required: true
  - type: input
    id: v-docker
    attributes:
      label: Docker
      description: Die Versionsnummer von Docker Entwicklungsumgebung.
      placeholder: 4.86.0
    validations:
      required: false
  - type: input
    id: v-ddev
    attributes:
      label: DDEV
      description: Die Versionsnummer von DDEV Entwicklungsumgebung.
      placeholder: 1.0.0
    validations:
      required: false
  - type: input
    id: v-vite
    attributes:
      label: Vite
      description: Die Versionsnummer von Vite Build Tool.
      placeholder: 1.0.0
    validations:
      required: false
  - type: input
    id: v-node
    attributes:
      label: Node
      description: Die Versionsnummer von Node.js.
      placeholder: 1.0.0
    validations:
      required: false
